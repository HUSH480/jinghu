<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖行</title>


<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #11131b;
    color: #eee1c8;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 5px 0;
    letter-spacing: 8px;
}

.subtitle {
    color: #aaa39a;
    margin: 5px 0 16px;
}

canvas {
    width: min(960px, 100%);
    height: auto;
    background: #151b2a;
    border: 3px solid #766147;
    image-rendering: pixelated;
}

.controls,
#gameButtons {
    width: min(960px, 100%);
}

.controls {
    padding: 12px;
    margin-top: 12px;
    background: #20232c;
    border: 1px solid #45434a;
    font-size: 14px;
    line-height: 2;
}

.controls b {
    color: #e8c778;
}

#gameButtons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
}

button {
    padding: 8px 15px;
    margin: 4px;
    color: #f5e9d0;
    background: #45352b;
    border: 1px solid #9d825c;
    cursor: pointer;
    font-family: inherit;
}

button:hover {
    background: #705039;
}

#stageMessage {
    color: #f0d49a;
    font-size: 16px;
    min-height: 25px;
    margin: 8px;
}

#inventoryOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

#inventoryOverlay.open {
    display: flex;
}

.inventoryWindow {
    width: min(850px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #211e21;
    border: 2px solid #a78b5d;
    padding: 18px;
}

.inventoryHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #6b5942;
    padding-bottom: 10px;
}

.inventoryHeader h2 {
    margin: 0;
    letter-spacing: 3px;
}

.inventoryGrid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-top: 16px;
}

.panel {
    background: #2b282b;
    border: 1px solid #55483a;
    padding: 12px;
    min-width: 0;
}

.panel h3 {
    color: #e6c78a;
    margin-top: 0;
}

.equipmentSlot,
.itemCard {
    padding: 10px;
    border: 1px solid #55483a;
    margin-bottom: 8px;
    background: #242125;
    overflow-wrap: anywhere;
}

.itemName {
    font-weight: bold;
    font-size: 15px;
}

.rarity {
    font-size: 12px;
    margin-left: 6px;
}

.rarity-普通 { color: #d0c8b7; }
.rarity-优秀 { color: #6bd69b; }
.rarity-稀有 { color: #7ebdff; }
.rarity-传说 { color: #e7b5ff; }

.itemDescription {
    color: #bdb4a6;
    font-size: 12px;
    line-height: 1.7;
    margin: 7px 0;
}

.itemStats {
    color: #d7c18e;
    font-size: 13px;
}

.empty {
    color: #89827a;
    padding: 8px 0;
}

#notice {
    min-height: 22px;
    color: #f1d08b;
    margin: 8px 0;
}

.statsBox {
    padding: 10px;
    background: #17161a;
    line-height: 2;
    margin-bottom: 12px;
}

@media (max-width: 600px) {
    body { padding: 8px; }
    .inventoryGrid { grid-template-columns: 1fr; }
    .inventoryWindow { padding: 10px; }
}
</style>
</head>

<body>

<h1>江湖行</h1>
<p class="subtitle">仗剑江湖，步步登高</p>

<canvas id="game" width="960" height="540"></canvas>

<div id="stageMessage"></div>

<div class="controls">
    <b>移动：</b>A / D 或方向键　
    <b>跳跃：</b>空格　
    <b>近战：</b>J　
    <b>闪避：</b>Shift　
    <b>剑气：</b>K　
    <b>背包：</b>I
</div>

<div id="gameButtons">
    <button id="openInventory">🎒 打开背包（I）</button>
    <button id="restart">重新开始</button>
    <button id="nextButton" style="display:none">进入下一关</button>
</div>

<div id="inventoryOverlay">
    <div class="inventoryWindow">
        <div class="inventoryHeader">
            <h2>江湖行 · 行囊</h2>
            <button id="closeInventory">关闭（Esc）</button>
        </div>

        <div id="notice"></div>

        <div class="inventoryGrid">
            <section class="panel">
                <h3>角色属性</h3>
                <div id="playerStats" class="statsBox"></div>

                <h3>当前装备</h3>
                <div id="equippedList"></div>
            </section>

            <section class="panel">
                <h3>随身背包</h3>
                <div id="inventoryList"></div>
            </section>
        </div>
    </div>
</div>

<script src="equipment.js"></script>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const GROUND = 450;
const MAP_WIDTH = 4800;

const Equipment = window.EquipmentSystem;

if (!Equipment) {
    throw new Error("装备系统加载失败，请检查 equipment.js。");
}

const keys = {};

let player;
let enemies = [];
let boss = null;
let projectiles = [];
let particles = [];

let stage = 0;
let coins = 0;
let gameState = "playing";
let cameraX = 0;
let screenShake = 0;
let lastTime = 0;
let nextEnemyId = 1;
let inventoryOpen = false;
let noticeTimer = null;

// 每关拥有更长的地图，最后一关挑战 Boss。
const stages = [
    {
        name: "荒山小道",
        enemyName: "山贼",
        enemyCount: 3,
        enemyHp: 40,
        enemyDamage: 8,
        enemySpeed: 1.1,
        reward: 50,
        boss: false
    },
    {
        name: "竹林深处",
        enemyName: "竹林刺客",
        enemyCount: 4,
        enemyHp: 55,
        enemyDamage: 10,
        enemySpeed: 1.45,
        reward: 100,
        boss: false
    },
    {
        name: "破败山庄",
        enemyName: "山庄守卫",
        enemyCount: 5,
        enemyHp: 70,
        enemyDamage: 12,
        enemySpeed: 1.3,
        reward: 150,
        boss: false
    },
    {
        name: "幽暗地宫",
        enemyName: "地宫死士",
        enemyCount: 6,
        enemyHp: 85,
        enemyDamage: 15,
        enemySpeed: 1.5,
        reward: 200,
        boss: false
    },
    {
        name: "悬崖绝壁",
        enemyName: "黑衣刀客",
        enemyCount: 0,
        enemyHp: 0,
        enemyDamage: 0,
        enemySpeed: 0,
        reward: 500,
        boss: true
    }
];

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function overlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function getStats() {
    return Equipment.getStats();
}

function getAttackDamage(base) {
    return Math.max(1, base + getStats().attack);
}

function drawBar(x, y, w, h, ratio, color) {
    ctx.fillStyle = "#211c21";
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = color;
    ctx.fillRect(
        x + 2,
        y + 2,
        Math.max(0, (w - 4) * clamp(ratio, 0, 1)),
        h - 4
    );

    ctx.strokeStyle = "#c7b69a";
    ctx.strokeRect(x, y, w, h);
}

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.8) * 5,
            life: 20 + Math.random() * 15,
            color
        });
    }
}

function updateParticles() {
    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.life--;
    }

    particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = clamp(p.life / 25, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - cameraX, p.y, 4, 4);
    }

    ctx.globalAlpha = 1;
}

function createEnemy(index, config) {
    return {
        instanceId: nextEnemyId++,
        name: config.enemyName,
        x: Math.min(700 + index * 280, MAP_WIDTH - 200),
        y: GROUND - 54,
        w: 34,
        h: 54,
        hp: config.enemyHp,
        maxHp: config.enemyHp,
        damage: config.enemyDamage,
        speed: config.enemySpeed,
        facing: -1,
        alive: true,
        attackCooldown: 50,
        attackTimer: 0,
        hitTimer: 0
    };
}

function resetGame() {
    player = {
        x: 100,
        y: GROUND - 64,
        w: 36,
        h: 64,
        vx: 0,
        vy: 0,
        speed: 4.2,
        jumpPower: -12,
        facing: 1,
        hp: 100,
        maxHp: 100,
        onGround: true,
        attackTimer: 0,
        attackCooldown: 0,
        dodgeTimer: 0,
        dodgeCooldown: 0,
        invincibleTimer: 0,
        hitTimer: 0
    };

    stage = 0;
    coins = 0;
    gameState = "playing";
    cameraX = 0;
    screenShake = 0;
    nextEnemyId = 1;

    enemies = [];
    boss = null;
    projectiles = [];
    particles = [];

    Equipment.clearInventory();
    Equipment.addItem("wooden_sword");
    Equipment.addItem("cloth_robe");
    Equipment.addItem("jade_pendant");

    for (const item of Equipment.getInventory()) {
        Equipment.equipItem(item.instanceId);
    }

    createStage(stage);
    closeInventory();
    updateStageMessage();
}

function createStage(index) {
    enemies = [];
    boss = null;
    projectiles = [];
    particles = [];

    const config = stages[index];

    if (!config) {
        gameState = "victory";
        return;
    }

    if (config.boss) {
        boss = {
            instanceId: nextEnemyId++,
            name: "黑衣刀客",
            x: MAP_WIDTH - 350,
            y: GROUND - 82,
            w: 48,
            h: 82,
            hp: 180,
            maxHp: 180,
            damage: 18,
            speed: 1.6,
            facing: -1,
            alive: true,
            attackCooldown: 70,
            attackTimer: 0,
            hitTimer: 0,
            invincibleTimer: 0
        };
    } else {
        // 第一名敌人先出现，其余敌人等待前一名被击败。
        enemies.push(createEnemy(0, config));
    }

    updateStageMessage();
}

function updateStageMessage() {
    const config = stages[stage];

    document.getElementById("stageMessage").textContent =
        config
            ? `第 ${stage + 1} 关：${config.name}`
            : "所有关卡已完成！";
}

// -------------------- 键盘 --------------------

document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if ([" ", "arrowleft", "arrowright", "shift"].includes(key)) {
        event.preventDefault();
    }

    if (key === "i" && !keys[key]) {
        toggleInventory();
        keys[key] = true;
        return;
    }

    if (key === "escape" && inventoryOpen) {
        closeInventory();
        keys[key] = true;
        return;
    }

    if (inventoryOpen) {
        keys[key] = true;
        return;
    }

    if (!keys[key] && gameState === "playing") {
        if (key === "j") attack();
        if (key === "k") shootProjectile();
        if (key === "shift") dodge();
    }

    keys[key] = true;
});

document.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

document.getElementById("restart").addEventListener("click", resetGame);
document.getElementById("openInventory").addEventListener("click", toggleInventory);
document.getElementById("closeInventory").addEventListener("click", closeInventory);

document.getElementById("nextButton").addEventListener("click", () => {
    if (gameState !== "stageClear") return;

    stage++;

    if (stage >= stages.length) {
        gameState = "victory";
        updateStageMessage();
        return;
    }

    player.x = 100;
    player.y = GROUND - player.h;
    player.vx = 0;
    player.vy = 0;
    player.hp = Math.min(player.maxHp, player.hp + 25);

    cameraX = 0;
    createStage(stage);
    gameState = "playing";
    updateStageMessage();
});

// -------------------- 背包 --------------------

function toggleInventory() {
    if (inventoryOpen) closeInventory();
    else openInventory();
}

function openInventory() {
    inventoryOpen = true;
    document.getElementById("inventoryOverlay").classList.add("open");
    renderInventory();
}

function closeInventory() {
    inventoryOpen = false;
    document.getElementById("inventoryOverlay").classList.remove("open");
}

function showNotice(message) {
    const notice = document.getElementById("notice");
    notice.textContent = message;

    if (noticeTimer) clearTimeout(noticeTimer);

    noticeTimer = setTimeout(() => {
        notice.textContent = "";
    }, 2500);
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function renderInventory() {
    const stats = getStats();

    document.getElementById("playerStats").innerHTML = `
        <div>攻击力：<strong>${stats.attack}</strong></div>
        <div>防御力：<strong>${stats.defense}</strong></div>
        <div>生命值：<strong>${player.hp}/${player.maxHp}</strong></div>
        <div>金币：<strong>${coins}</strong></div>
    `;

    renderEquipped();
    renderInventoryItems();
}

function renderEquipped() {
    const container = document.getElementById("equippedList");
    const equipped = Equipment.getEquipped();

    container.innerHTML = "";

    for (const slot of ["weapon", "armor", "accessory"]) {
        const item = equipped[slot];
        const div = document.createElement("div");
        div.className = "equipmentSlot";

        if (!item) {
            div.innerHTML = `
                <div>${Equipment.slotNames[slot]}</div>
                <div class="empty">尚未装备</div>
            `;
        } else {
            div.innerHTML = `
                <div class="itemName">
                    ${Equipment.slotNames[slot]}：${escapeHTML(item.name)}
                    <span class="rarity rarity-${item.rarity}">${item.rarity}</span>
                </div>
                <div class="itemStats">
                    攻击 +${item.attack}｜防御 +${item.defense}
                </div>
                <button data-unequip="${slot}">卸下</button>
            `;
        }

        container.appendChild(div);
    }

    container.querySelectorAll("[data-unequip]").forEach(button => {
        button.addEventListener("click", () => {
            const result = Equipment.unequipItem(button.dataset.unequip);
            showNotice(result.message);
            renderInventory();
        });
    });
}

function renderInventoryItems() {
    const container = document.getElementById("inventoryList");
    const items = Equipment.getInventory();

    container.innerHTML = "";

    if (items.length === 0) {
        container.innerHTML = '<div class="empty">背包空空如也。</div>';
        return;
    }

    for (const item of items) {
        const card = document.createElement("div");
        card.className = "itemCard";

        card.innerHTML = `
            <div class="itemName">
                ${escapeHTML(item.name)}
                <span class="rarity rarity-${item.rarity}">${item.rarity}</span>
            </div>
            <div class="itemDescription">${escapeHTML(item.description)}</div>
            <div class="itemStats">攻击 +${item.attack}｜防御 +${item.defense}</div>
            <div class="itemDescription">售价：${item.price} 金币</div>
            <button data-equip="${item.instanceId}">装备</button>
        `;

        container.appendChild(card);
    }

    container.querySelectorAll("[data-equip]").forEach(button => {
        button.addEventListener("click", () => {
            const result = Equipment.equipItem(Number(button.dataset.equip));
            showNotice(result.message);

            if (result.success) renderInventory();
        });
    });
}

// -------------------- 玩家战斗 --------------------

function attack() {
    if (player.attackCooldown > 0) return;

    player.attackTimer = 12;
    player.attackCooldown = 22;

    const targets = enemies.filter(enemy => enemy.alive);

    if (boss && boss.alive) targets.push(boss);

    for (const target of targets) {
        const dx =
            target.x + target.w / 2 -
            (player.x + player.w / 2);

        const inFront = dx * player.facing > 0;
        const inRange = Math.abs(dx) < (target === boss ? 95 : 70);

        const verticalOverlap =
            player.y < target.y + target.h &&
            player.y + player.h > target.y;

        if (inFront && inRange && verticalOverlap) {
            damageTarget(target, getAttackDamage(10));
        }
    }
}

function dodge() {
    if (player.dodgeCooldown > 0) return;

    player.dodgeTimer = 10;
    player.dodgeCooldown = 42;
    player.invincibleTimer = 14;
    player.vx = player.facing * 9;

    addParticles(
        player.x + player.w / 2,
        player.y + player.h,
        "#9ebbd2",
        6
    );
}

function shootProjectile() {
    projectiles.push({
        x: player.x + player.w / 2 + player.facing * 20,
        y: player.y + 25,
        vx: player.facing * 8,
        life: 75,
        damage: 8 + getStats().attack,
        hitTargets: []
    });
}

function damageTarget(target, damage) {
    if (!target.alive) return;

    if (target === boss && target.invincibleTimer > 0) return;

    target.hp = Math.max(0, target.hp - damage);
    target.hitTimer = 10;

    if (target === boss) target.invincibleTimer = 8;

    addParticles(
        target.x + target.w / 2,
        target.y + target.h / 2,
        target === boss ? "#d94b43" : "#e5bd70",
        10
    );

    if (target.hp > 0) return;

    target.alive = false;

    if (target === boss) {
        coins += stages[stage].reward;
        Equipment.addItem("frost_sword");
        gameState = "stageClear";
        showNotice("击败黑衣刀客！获得寒霜剑！");
        return;
    }

    coins += 10;

    if (Math.random() < 0.35) {
        const drops = [
            "wooden_sword",
            "cloth_robe",
            "jade_pendant",
            "leather_armor",
            "iron_sword"
        ];

        const itemId = drops[Math.floor(Math.random() * drops.length)];
        const item = Equipment.findById(itemId);

        Equipment.addItem(itemId);
        showNotice(`获得装备：${item.name}`);
    }

    const config = stages[stage];
    const defeatedCount = config.enemyCount - enemies.length + 1;
    const aliveEnemies = enemies.filter(enemy => enemy.alive).length;

    if (defeatedCount < config.enemyCount) {
        enemies.push(createEnemy(defeatedCount, config));
    }

    if (aliveEnemies === 0 && defeatedCount >= config.enemyCount) {
        gameState = "stageClear";
        coins += config.reward;
        showNotice(`本关完成！获得 ${config.reward} 金币。`);
    }
}

function damagePlayer(damage) {
    if (player.invincibleTimer > 0 || gameState !== "playing") return;

    const actualDamage = Math.max(1, damage - getStats().defense);

    player.hp = Math.max(0, player.hp - actualDamage);
    player.hitTimer = 10;
    player.invincibleTimer = 40;
    screenShake = 7;

    addParticles(
        player.x + player.w / 2,
        player.y + player.h / 2,
        "#d94b43",
        10
    );

    if (player.hp <= 0) gameState = "defeat";

    if (inventoryOpen) renderInventory();
}

// -------------------- 更新角色 --------------------

function updatePlayer() {
    if (keys["a"] || keys["arrowleft"]) {
        player.vx = -player.speed;
        player.facing = -1;
    } else if (keys["d"] || keys["arrowright"]) {
        player.vx = player.speed;
        player.facing = 1;
    } else if (player.dodgeTimer <= 0) {
        player.vx *= 0.72;

        if (Math.abs(player.vx) < 0.15) player.vx = 0;
    }

    if ((keys[" "] || keys["w"] || keys["arrowup"]) && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }

    if (player.dodgeTimer > 0) player.dodgeTimer--;
    if (player.dodgeCooldown > 0) player.dodgeCooldown--;
    if (player.attackTimer > 0) player.attackTimer--;
    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.invincibleTimer > 0) player.invincibleTimer--;
    if (player.hitTimer > 0) player.hitTimer--;

    player.x += player.vx;

    player.vy += 0.55;
    player.y += player.vy;

    if (player.y + player.h >= GROUND) {
        player.y = GROUND - player.h;
        player.vy = 0;
        player.onGround = true;
    }

    // 角色只能在地图范围内移动。
    player.x = clamp(player.x, 0, MAP_WIDTH - player.w);

    // 镜头跟随玩家，但不会越过地图边界。
    cameraX = clamp(
        player.x - WIDTH * 0.4,
        0,
        MAP_WIDTH - WIDTH
    );
}

// -------------------- 敌人 AI --------------------

function updateEnemy(enemy) {
    if (!enemy.alive) return;

    if (enemy.hitTimer > 0) enemy.hitTimer--;
    if (enemy.attackCooldown > 0) enemy.attackCooldown--;
    if (enemy.attackTimer > 0) enemy.attackTimer--;

    const dx = player.x - enemy.x;

    enemy.facing = dx >= 0 ? 1 : -1;

    if (Math.abs(dx) > 42) {
        enemy.x += Math.sign(dx) * enemy.speed;
    }

    if (Math.abs(dx) < 48 && enemy.attackCooldown <= 0) {
        enemy.attackCooldown = 70;
        enemy.attackTimer = 12;
        damagePlayer(enemy.damage);
    }

    enemy.x = clamp(enemy.x, 0, MAP_WIDTH - enemy.w);
}

function updateBoss() {
    if (!boss || !boss.alive) return;

    if (boss.hitTimer > 0) boss.hitTimer--;
    if (boss.attackCooldown > 0) boss.attackCooldown--;
    if (boss.attackTimer > 0) boss.attackTimer--;
    if (boss.invincibleTimer > 0) boss.invincibleTimer--;

    const dx = player.x - boss.x;

    boss.facing = dx >= 0 ? 1 : -1;

    if (Math.abs(dx) > 58) {
        boss.x += Math.sign(dx) * boss.speed;
    }

    if (Math.abs(dx) < 72 && boss.attackCooldown <= 0) {
        boss.attackCooldown = 85;
        boss.attackTimer = 20;
        damagePlayer(boss.damage);
    }

    boss.x = clamp(boss.x, 0, MAP_WIDTH - boss.w);
}

// -------------------- 剑气 --------------------

function updateProjectiles() {
    for (const projectile of projectiles) {
        projectile.x += projectile.vx;
        projectile.life--;

        const targets = enemies.filter(enemy => enemy.alive);

        if (boss && boss.alive) targets.push(boss);

        for (const target of targets) {
            if (projectile.hitTargets.includes(target.instanceId)) continue;

            const box = {
                x: projectile.x - 10,
                y: projectile.y - 8,
                w: 20,
                h: 16
            };

            if (overlap(box, target)) {
                damageTarget(target, projectile.damage);
                projectile.hitTargets.push(target.instanceId);
                projectile.life = 0;
                break;
            }
        }
    }

    projectiles = projectiles.filter(p => p.life > 0);
}

function update() {
    if (gameState !== "playing") {
        updateParticles();
        return;
    }

    updatePlayer();

    for (const enemy of enemies) updateEnemy(enemy);

    updateBoss();
    updateProjectiles();
    updateParticles();

    if (screenShake > 0) {
        screenShake *= 0.8;
        if (screenShake < 0.3) screenShake = 0;
    }
}

// -------------------- 绘制地图 --------------------

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);

    sky.addColorStop(0, "#101727");
    sky.addColorStop(0.65, "#34364a");
    sky.addColorStop(1, "#6b5148");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // 远处的月亮固定在屏幕中，营造远景。
    ctx.fillStyle = "#eee2bb";
    ctx.beginPath();
    ctx.arc(760, 95, 36, 0, Math.PI * 2);
    ctx.fill();

    // 山脉按镜头的不同速度移动，产生远近层次。
    drawMountains(0.15, "#202b3a", 305, 135);
    drawMountains(0.3, "#19252d", 365, 105);

    // 地面使用世界坐标生成，移动时地面纹理也会滚动。
    ctx.fillStyle = "#302d30";
    ctx.fillRect(0, GROUND, WIDTH, HEIGHT - GROUND);

    ctx.fillStyle = "#514139";
    ctx.fillRect(0, GROUND, WIDTH, 5);

    const start = Math.floor(cameraX / 65) * 65;

    for (let worldX = start; worldX < cameraX + WIDTH + 65; worldX += 65) {
        const screenX = worldX - cameraX;

        ctx.fillStyle = "#464044";
        ctx.fillRect(
            screenX,
            GROUND + 22 + (Math.floor(worldX / 65) % 3) * 4,
            25,
            3
        );
    }

    // 路边的树木和石块。
    for (let worldX = 180; worldX < MAP_WIDTH; worldX += 360) {
        const sx = worldX - cameraX;

        if (sx < -80 || sx > WIDTH + 80) continue;

        ctx.fillStyle = "#30252a";
        ctx.fillRect(sx, GROUND - 100, 18, 100);

        ctx.fillStyle = "#1a302d";
        ctx.beginPath();
        ctx.moveTo(sx - 45, GROUND - 75);
        ctx.lineTo(sx + 9, GROUND - 180);
        ctx.lineTo(sx + 63, GROUND - 75);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#242d2b";
        ctx.beginPath();
        ctx.moveTo(sx - 35, GROUND - 110);
        ctx.lineTo(sx + 9, GROUND - 205);
        ctx.lineTo(sx + 53, GROUND - 110);
        ctx.closePath();
        ctx.fill();
    }

    // 地图尽头的木门。
    if (cameraX + WIDTH > MAP_WIDTH - 300) {
        const gateX = MAP_WIDTH - 150 - cameraX;

        ctx.fillStyle = "#6b4934";
        ctx.fillRect(gateX - 45, GROUND - 100, 14, 100);
        ctx.fillRect(gateX + 31, GROUND - 100, 14, 100);
        ctx.fillRect(gateX - 55, GROUND - 110, 110, 14);

        ctx.fillStyle = "#c2a16a";
        ctx.fillRect(gateX - 4, GROUND - 95, 8, 90);
    }

    const shade = ctx.createRadialGradient(
        WIDTH / 2, HEIGHT / 2, 100,
        WIDTH / 2, HEIGHT / 2, 550
    );

    shade.addColorStop(0, "rgba(0,0,0,0)");
    shade.addColorStop(1, "rgba(0,0,0,0.4)");

    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
}

function drawMountains(speed, color, baseY, height) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);

    const shift = cameraX * speed;
    const step = 260;
    const start = Math.floor(shift / step) * step;

    for (let wx = start; wx <= shift + WIDTH + step; wx += step) {
        const worldIndex = Math.floor(wx / step);
        const peak = baseY - ((worldIndex * 73) % height);

        ctx.lineTo(wx - shift, peak);
        ctx.lineTo(wx - shift + step / 2, baseY + 45);
    }

    ctx.lineTo(WIDTH, GROUND);
    ctx.closePath();
    ctx.fill();
}

// -------------------- 绘制玩家 --------------------

function drawPlayer() {
    const x = player.x - cameraX;
    const y = player.y;

    if (
        player.invincibleTimer > 0 &&
        Math.floor(player.invincibleTimer / 4) % 2 === 0
    ) return;

    ctx.fillStyle = "#762e35";
    ctx.fillRect(x + 4, y + 25, 28, 30);

    ctx.fillStyle = player.hitTimer > 0 ? "#e6d7d0" : "#d7d0c0";
    ctx.fillRect(x + 7, y + 23, 23, 31);

    ctx.fillStyle = "#7d342d";
    ctx.fillRect(x + 6, y + 42, 25, 5);

    ctx.fillStyle = "#272a34";
    ctx.fillRect(x + 8, y + 52, 8, 12);
    ctx.fillRect(x + 21, y + 52, 8, 12);

    ctx.fillStyle = "#e0bda0";
    ctx.fillRect(x + 8, y + 4, 23, 22);

    ctx.fillStyle = "#181820";
    ctx.fillRect(x + 6, y + 2, 27, 10);
    ctx.fillRect(x + 5, y + 8, 7, 15);

    ctx.fillStyle = "#b7a16f";
    ctx.fillRect(x + 7, y + 8, 25, 3);

    ctx.fillStyle = "#292329";
    ctx.fillRect(
        player.facing === 1 ? x + 25 : x + 10,
        y + 15,
        3,
        3
    );

    ctx.fillStyle = "#d7d0c0";

    if (player.attackTimer > 0) {
        ctx.fillRect(
            player.facing === 1 ? x + 25 : x - 9,
            y + 28,
            20,
            7
        );
    } else {
        ctx.fillRect(x + 2, y + 27, 7, 19);
    }

    const weapon = Equipment.getEquipped().weapon;
    let swordColor = "#c0c8c9";

    if (weapon) {
        if (weapon.id === "frost_sword") swordColor = "#91e5ff";
        else if (weapon.id === "dragon_sword") swordColor = "#f0b85c";
        else if (weapon.id === "iron_sword") swordColor = "#d5dce5";
        else if (weapon.id === "wooden_sword") swordColor = "#b38a59";
    }

    ctx.fillStyle = swordColor;

    if (player.attackTimer > 0) {
        const swordX = player.facing === 1 ? x + 35 : x - 43;
        ctx.fillRect(swordX, y + 25, 45, 4);
    } else {
        ctx.fillRect(
            player.facing === 1 ? x + 25 : x + 4,
            y + 34,
            3,
            24
        );
    }
}

// -------------------- 绘制敌人 --------------------

function drawEnemy(enemy) {
    if (!enemy.alive) return;

    const x = enemy.x - cameraX;
    const y = enemy.y;

    if (x < -100 || x > WIDTH + 100) return;

    ctx.fillStyle = enemy.hitTimer > 0 ? "#f0b0a0" : "#783e35";
    ctx.fillRect(x + 5, y + 18, 25, 27);

    ctx.fillStyle = "#24242b";
    ctx.fillRect(x + 3, y + 43, 10, 11);
    ctx.fillRect(x + 21, y + 43, 10, 11);

    ctx.fillStyle = "#d4ac8b";
    ctx.fillRect(x + 7, y + 3, 22, 20);

    ctx.fillStyle = "#282128";
    ctx.fillRect(x + 5, y + 1, 26, 8);

    ctx.fillStyle = "#bca27b";
    ctx.fillRect(x + 5, y + 8, 26, 3);

    drawBar(
        x - 5,
        y - 15,
        45,
        7,
        enemy.hp / enemy.maxHp,
        "#c4483f"
    );
}

function drawBoss() {
    if (!boss || !boss.alive) return;

    const x = boss.x - cameraX;
    const y = boss.y;

    if (x < -120 || x > WIDTH + 120) return;

    ctx.fillStyle = boss.hitTimer > 0 ? "#a54b47" : "#29212f";
    ctx.fillRect(x + 3, y + 25, 42, 45);

    ctx.fillStyle = "#171820";
    ctx.fillRect(x + 8, y + 22, 32, 43);

    ctx.fillStyle = "#8e3b3c";
    ctx.fillRect(x + 7, y + 48, 34, 5);

    ctx.fillStyle = "#171820";
    ctx.fillRect(x + 8, y + 65, 12, 17);
    ctx.fillRect(x + 28, y + 65, 12, 17);

    ctx.fillStyle = "#d3b39b";
    ctx.fillRect(x + 10, y + 5, 29, 25);

    ctx.fillStyle = "#0b0d14";
    ctx.fillRect(x + 7, y + 1, 35, 12);
    ctx.fillRect(x + 6, y + 8, 9, 20);

    ctx.fillStyle = "#24232a";
    ctx.fillRect(x + 9, y + 17, 31, 12);

    ctx.fillStyle = "#d64a4a";
    ctx.fillRect(
        boss.facing === 1 ? x + 31 : x + 12,
        y + 17,
        5,
        3
    );

    ctx.fillStyle = "#c5cdd1";

    if (boss.attackTimer > 0) {
        ctx.fillRect(
            boss.facing === 1 ? x + 40 : x - 50,
            y + 31,
            55,
            5
        );
    } else {
        ctx.fillRect(
            boss.facing === 1 ? x + 37 : x - 8,
            y + 31,
            5,
            38
        );
    }

    ctx.textAlign = "center";
    ctx.fillStyle = "#f1d5a2";
    ctx.font = "bold 16px Microsoft YaHei";
    ctx.fillText(boss.name, x + boss.w / 2, y - 34);

    drawBar(
        x - 22,
        y - 24,
        boss.w + 44,
        10,
        boss.hp / boss.maxHp,
        "#b63740"
    );

    ctx.textAlign = "left";
}

function drawProjectiles() {
    for (const projectile of projectiles) {
        const x = projectile.x - cameraX;

        ctx.fillStyle = "rgba(119,197,230,0.25)";
        ctx.fillRect(x - 19, projectile.y - 10, 40, 20);

        ctx.fillStyle = "#b7e8f2";
        ctx.fillRect(x - 13, projectile.y - 4, 27, 8);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x - 8, projectile.y - 2, 20, 4);
    }
}

// -------------------- UI --------------------

function drawUI() {
    ctx.fillStyle = "rgba(10,12,18,0.78)";
    ctx.fillRect(18, 16, 270, 85);

    const stats = getStats();

    ctx.fillStyle = "#f1e2c3";
    ctx.font = "bold 17px Microsoft YaHei";
    ctx.fillText("侠客", 30, 39);

    drawBar(30, 48, 230, 18, player.hp / player.maxHp, "#4caa72");

    ctx.font = "13px Microsoft YaHei";
    ctx.fillStyle = "#f3e8cc";
    ctx.fillText(`${player.hp}/${player.maxHp}`, 105, 62);

    ctx.fillStyle = "#e6ca8e";
    ctx.font = "14px Microsoft YaHei";
    ctx.fillText(`攻击 ${stats.attack}  防御 ${stats.defense}`, 30, 82);
    ctx.fillText(`金币：${coins}`, 30, 96);

    ctx.fillStyle = "#f0d49a";
    ctx.font = "16px Microsoft YaHei";
    ctx.fillText(`第 ${stage + 1} 关：${stages[stage].name}`, 350, 30);

    if (boss && boss.alive) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#f1d5a2";
        ctx.fillText("危险人物：黑衣刀客", 480, 65);
        ctx.textAlign = "left";
    }

    if (gameState === "stageClear") {
        drawOverlay(
            "本关完成",
            "你已击败本关所有敌人",
            "点击下方按钮进入下一关"
        );
    }

    if (gameState === "victory") {
        drawOverlay("江湖扬名", "你完成了所有关卡！", `获得金币：${coins}`);
    }

    if (gameState === "defeat") {
        drawOverlay("侠客倒下", "你在江湖中落败", "点击重新开始，再战江湖");
    }
}

function drawOverlay(title, message, hint) {
    ctx.fillStyle = "rgba(5,7,13,0.78)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f0d18d";
    ctx.font = "bold 42px Microsoft YaHei";
    ctx.fillText(title, WIDTH / 2, 205);

    ctx.fillStyle = "#f4ead8";
    ctx.font = "21px Microsoft YaHei";
    ctx.fillText(message, WIDTH / 2, 255);

    ctx.fillStyle = "#c1b9aa";
    ctx.font = "15px Microsoft YaHei";
    ctx.fillText(hint, WIDTH / 2, 295);

    ctx.textAlign = "left";
}

function draw() {
    ctx.save();

    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
    }

    drawBackground();

    drawProjectiles();

    for (const enemy of enemies) drawEnemy(enemy);

    drawBoss();
    drawPlayer();
    drawParticles();

    ctx.restore();

    drawUI();

    document.getElementById("nextButton").style.display =
        gameState === "stageClear" ? "inline-block" : "none";
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    const delta = Math.min((timestamp - lastTime) / 16.67, 2);
    lastTime = timestamp;

    if (delta > 0) update();

    draw();

    requestAnimationFrame(gameLoop);
}
resetGame();
requestAnimationFrame(gameLoop);
// 备份
</script>
